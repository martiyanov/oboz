# Обозреватель — веб-версия под https://agonarena.ru/oboz/
# Snippet подключается в server-блок agonarena.ru (443) в /etc/nginx/sites-enabled/agonarena_bot.
# proxy_pass с завершающим слешем снимает префикс /oboz/, приложение видит корень /.

location = /oboz {
    return 301 /oboz/;
}

location /oboz/ {
    limit_req zone=agonarena_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_buffering on;
}
